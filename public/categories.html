<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings - Categories</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f6fb; color: #1f2937; padding: 30px; max-width: 600px; margin: 0 auto; }
  h1 { color: #1a4f8a; }
  a.back { color: #5d6b7a; text-decoration: none; font-size: 13px; }
  a.back:hover { color: #1a4f8a; }
  .form-box { background: #ffffff; padding: 20px; border-radius: 8px; margin: 16px 0 20px; border: 1px solid #dfe7f0; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); }
  select, input { padding: 10px; border-radius: 6px; border: 1px solid #dfe7f0; background: #ffffff; color: #1f2937; margin-right: 8px; margin-bottom: 8px; }
  select { width: 40%; }
  input { width: 40%; }
  button { padding: 10px 16px; background: linear-gradient(135deg, #4e96ff 0%, #2d6cdf 100%); color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  button:hover { background: linear-gradient(135deg, #64a9ff 0%, #3679eb 100%); }
  ul { list-style: none; padding: 0; }
  li { background: #ffffff; padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #dfe7f0; }
  .li-left { display: flex; flex-direction: column; }
  .tag { font-size: 11px; color: #1a4f8a; text-transform: uppercase; }
  .del-btn { background: #c1543a; color: white; padding: 6px 12px; font-size: 12px; }
  .del-btn:hover { background: #d9634a; }
  #msg { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <a class="back" href="/settings.html">&larr; Hardware Types</a>
  <h1>Settings: Categories</h1>

  <div class="form-box">
    <select id="hardwareTypeSelect"></select>
    <input type="text" id="nameInput" placeholder="Example: Laptop - User">
    <button onclick="addCategory()">+ Add</button>
    <div id="msg"></div>
  </div>

  <ul id="list"></ul>

<script>
async function loadHardwareTypes() {
  const res = await fetch('/api/hardware-types');
  const data = await res.json();
  const select = document.getElementById('hardwareTypeSelect');
  select.innerHTML = '<option value="">-- Select Hardware Type --</option>';
  data.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name;
    select.appendChild(opt);
  });
}

async function loadList() {
  const res = await fetch('/api/categories');
  const data = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  data.forEach(item => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="li-left"><span class="tag">${item.hardware_type_name}</span><span>${item.name}</span></div><button class="del-btn" onclick="deleteCategory(${item.id})">Delete</button>`;
    list.appendChild(li);
  });
}

async function addCategory() {
  const hwSelect = document.getElementById('hardwareTypeSelect');
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  const hardware_type_id = hwSelect.value;
  const msg = document.getElementById('msg');
  if (!hardware_type_id) {
    msg.textContent = 'Please select a Hardware Type first.';
    return;
  }
  if (!name) {
    msg.textContent = 'Please enter a name.';
    return;
  }
  const res = await fetch('/api/categories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, hardware_type_id })
  });
  if (res.ok) {
    msg.textContent = 'Added successfully!';
    input.value = '';
    loadList();
  } else {
    msg.textContent = 'Error adding data.';
  }
}

async function deleteCategory(id) {
  if (!confirm('Delete this item?')) return;
  await fetch(`/api/categories/${id}`, { method: 'DELETE' });
  loadList();
}

loadHardwareTypes();
loadList();
</script>
</body>
</html>
