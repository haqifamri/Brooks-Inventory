<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings - Statuses</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f6fb; color: #1f2937; padding: 30px; max-width: 600px; margin: 0 auto; }
  h1 { color: #1a4f8a; }
  a.back { color: #5d6b7a; text-decoration: none; font-size: 13px; margin-right: 12px; }
  a.back:hover { color: #1a4f8a; }
  .form-box { background: #ffffff; padding: 20px; border-radius: 8px; margin: 16px 0 20px; border: 1px solid #dfe7f0; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); }
  input[type=text] { padding: 10px; width: 45%; border-radius: 6px; border: 1px solid #dfe7f0; background: #ffffff; color: #1f2937; margin-right: 8px; margin-bottom: 8px; }
  input[type=color] { width: 50px; height: 42px; padding: 2px; border-radius: 6px; border: 1px solid #dfe7f0; background: #ffffff; cursor: pointer; margin-right: 8px; vertical-align: middle; }
  button { padding: 10px 16px; background: linear-gradient(135deg, #4e96ff 0%, #2d6cdf 100%); color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  button:hover { background: linear-gradient(135deg, #64a9ff 0%, #3679eb 100%); }
  ul { list-style: none; padding: 0; }
  li { background: #ffffff; padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #dfe7f0; }
  .li-left { display: flex; align-items: center; gap: 10px; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #dfe7f0; display: inline-block; }
  .del-btn { background: #c1543a; color: white; padding: 6px 12px; font-size: 12px; }
  .del-btn:hover { background: #d9634a; }
  #msg { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <a class="back" href="/settings.html">&larr; Hardware Types</a>
  <a class="back" href="/categories.html">Categories</a>
  <h1>Settings: Statuses</h1>

  <div class="form-box">
    <input type="color" id="colorInput" value="#4CAF50">
    <input type="text" id="nameInput" placeholder="Example: Ready for Onboarding">
    <button onclick="addStatus()">+ Add</button>
    <div id="msg"></div>
  </div>

  <ul id="list"></ul>

<script>
async function loadList() {
  const res = await fetch('/api/statuses');
  const data = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  data.forEach(item => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="li-left"><span class="swatch" style="background:${item.color_hex}"></span><span>${item.name}</span></div><button class="del-btn" onclick="deleteStatus(${item.id})">Delete</button>`;
    list.appendChild(li);
  });
}

async function addStatus() {
  const colorInput = document.getElementById('colorInput');
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  const color_hex = colorInput.value;
  const msg = document.getElementById('msg');
  if (!name) {
    msg.textContent = 'Please enter a name.';
    return;
  }
  const res = await fetch('/api/statuses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, color_hex })
  });
  if (res.ok) {
    msg.textContent = 'Added successfully!';
    input.value = '';
    loadList();
  } else {
    msg.textContent = 'Error adding data.';
  }
}

async function deleteStatus(id) {
  if (!confirm('Delete this item?')) return;
  await fetch(`/api/statuses/${id}`, { method: 'DELETE' });
  loadList();
}

loadList();
</script>
</body>
</html>
