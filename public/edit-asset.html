<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Asset</title>
<script src="/sidebar.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f2f6fb; color: #1f2937; }
  h1 { color: #1a4f8a; margin-top: 0; }
  .top-actions { margin-bottom: 16px; }
  .btn-back { background: #edf3fb; color: #1f2937; padding: 8px 16px; border-radius: 6px; font-size: 13px; text-decoration: none; border: 1px solid #dfe7f0; cursor: pointer; }
  .btn-back:hover { background: #e2ebf8; }
  .form-box { background: #ffffff; padding: 24px; border-radius: 8px; max-width: 700px; border: 1px solid #dfe7f0; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); }
  .row { display: flex; gap: 12px; margin-bottom: 14px; }
  .field { flex: 1; display: flex; flex-direction: column; }
  label { font-size: 12px; color: #5d6b7a; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  input, select, textarea { padding: 9px; border-radius: 6px; border: 1px solid #dfe7f0; background: #ffffff; color: #1f2937; font-family: inherit; font-size: 14px; }
  textarea { resize: vertical; min-height: 60px; }
  .required { color: #c1543a; }
  .hint { font-size: 12px; color: #5d6b7a; margin: -6px 0 12px; }
  button.submit-btn { padding: 12px 20px; background: linear-gradient(135deg, #4e96ff 0%, #2d6cdf 100%); color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
  button.submit-btn:hover { background: linear-gradient(135deg, #64a9ff 0%, #3679eb 100%); }
  #msg { margin-top: 12px; font-size: 14px; }
  .msg-success { color: #1f8f5f; }
  .msg-error { color: #c1543a; }
  fieldset { border: 1px solid #dfe7f0; border-radius: 8px; margin-bottom: 16px; padding: 14px; background: #f8fbff; }
  legend { color: #1a4f8a; font-size: 13px; padding: 0 8px; }
</style>
</head>
<body>
  <div class="top-actions">
    <a class="btn-back" href="/assets.html">&larr; Back to Assets List</a>
  </div>
  <h1>Edit Asset</h1>

  <div class="form-box">
    <fieldset>
      <legend>Identification</legend>
      <div class="hint">Fill in Service Tag (ST) or Serial Number (S/N) &mdash; at least one is required.</div>
      <div class="row">
        <div class="field"><label>Service Tag (ST)</label><input type="text" id="service_tag"></div>
        <div class="field"><label>Serial Number (S/N)</label><input type="text" id="serial_number"></div>
      </div>
      <div class="row">
        <div class="field"><label>Host Name</label><input type="text" id="host_name"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Classification</legend>
      <div class="row">
        <div class="field"><label>Hardware Type <span class="required">*</span></label><select id="hardware_type_id"></select></div>
        <div class="field"><label>Model</label><input type="text" id="model_name" list="modelOptions" placeholder="Type or pick existing"><datalist id="modelOptions"></datalist></div>
      </div>
      <div class="row">
        <div class="field"><label>Category <span class="required">*</span></label><select id="category_id"></select></div>
        <div class="field"><label>Status <span class="required">*</span></label><select id="status_id"></select></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Dates</legend>
      <div class="row">
        <div class="field"><label>Date Received/GR</label><input type="date" id="date_received"></div>
        <div class="field"><label>Start Date/Date Deploy</label><input type="date" id="start_date"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Assignment</legend>
      <div class="row">
        <div class="field"><label>Asset Owner</label><input type="text" id="asset_owner"></div>
        <div class="field"><label>Login ID</label><input type="text" id="login_id"></div>
      </div>
      <div class="row">
        <div class="field"><label>Email</label><input type="email" id="email"></div>
        <div class="field"><label>Location</label><input type="text" id="location"></div>
      </div>
      <div class="row">
        <div class="field"><label>Teamviewer ID</label><input type="text" id="teamviewer_id"></div>
        <div class="field"><label>Box No.</label><input type="text" id="box_no"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Other</legend>
      <div class="row">
        <div class="field"><label>Remark</label><textarea id="remark"></textarea></div>
      </div>
    </fieldset>

    <button class="submit-btn" onclick="saveAsset()">Update Asset</button>
    <div id="msg"></div>
  </div>

<script>
let allCategories = [];
let allModels = [];
const assetId = new URLSearchParams(window.location.search).get('id');

function toDateInputValue(dateStr) {
  if (!dateStr) return '';
  return dateStr.split('T')[0];
}

async function loadDropdowns() {
  const hwRes = await fetch('/api/hardware-types');
  const hwData = await hwRes.json();
  const hwSelect = document.getElementById('hardware_type_id');
  hwSelect.innerHTML = '<option value="">-- Select --</option>';
  hwData.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name;
    hwSelect.appendChild(opt);
  });

  const catRes = await fetch('/api/categories');
  allCategories = await catRes.json();

  const modelRes = await fetch('/api/models');
  allModels = await modelRes.json();

  const statusRes = await fetch('/api/statuses');
  const statusData = await statusRes.json();
  const statusSelect = document.getElementById('status_id');
  statusSelect.innerHTML = '<option value="">-- Select --</option>';
  statusData.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name;
    statusSelect.appendChild(opt);
  });

  hwSelect.addEventListener('change', () => filterByHardwareType());
}

function filterByHardwareType(keepCategoryId, keepModelName) {
  const hwId = document.getElementById('hardware_type_id').value;
  const catSelect = document.getElementById('category_id');
  catSelect.innerHTML = '<option value="">-- Select --</option>';
  allCategories.filter(c => String(c.hardware_type_id) === String(hwId)).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    if (keepCategoryId && String(c.id) === String(keepCategoryId)) opt.selected = true;
    catSelect.appendChild(opt);
  });
  const modelList = document.getElementById('modelOptions');
  modelList.innerHTML = '';
  allModels.filter(m => String(m.hardware_type_id) === String(hwId)).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.name;
    modelList.appendChild(opt);
  });
  if (keepModelName) document.getElementById('model_name').value = keepModelName;
}

async function loadAsset() {
  if (!assetId) {
    document.getElementById('msg').className = 'msg-error';
    document.getElementById('msg').textContent = 'No asset ID provided.';
    return;
  }
  const res = await fetch(`/api/assets/${assetId}`);
  if (!res.ok) {
    document.getElementById('msg').className = 'msg-error';
    document.getElementById('msg').textContent = 'Asset not found.';
    return;
  }
  const a = await res.json();
  document.getElementById('service_tag').value = a.service_tag || '';
  document.getElementById('serial_number').value = a.serial_number || '';
  document.getElementById('host_name').value = a.host_name || '';
  document.getElementById('hardware_type_id').value = a.hardware_type_id || '';
  document.getElementById('status_id').value = a.status_id || '';
  document.getElementById('date_received').value = toDateInputValue(a.date_received);
  document.getElementById('start_date').value = toDateInputValue(a.start_date);
  document.getElementById('asset_owner').value = a.asset_owner || '';
  document.getElementById('login_id').value = a.login_id || '';
  document.getElementById('email').value = a.email || '';
  document.getElementById('location').value = a.location || '';
  document.getElementById('teamviewer_id').value = a.teamviewer_id || '';
  document.getElementById('box_no').value = a.box_no || '';
  document.getElementById('remark').value = a.remark || '';
  filterByHardwareType(a.category_id, a.model_name);
}

async function saveAsset() {
  const msg = document.getElementById('msg');
  const service_tag = document.getElementById('service_tag').value.trim();
  const serial_number = document.getElementById('serial_number').value.trim();
  const hardware_type_id = document.getElementById('hardware_type_id').value;
  const category_id = document.getElementById('category_id').value;
  const status_id = document.getElementById('status_id').value;

  if (!service_tag && !serial_number) {
    msg.className = 'msg-error';
    msg.textContent = 'Please fill Service Tag or Serial Number (at least one).';
    return;
  }
  if (!hardware_type_id || !category_id || !status_id) {
    msg.className = 'msg-error';
    msg.textContent = 'Please fill Hardware Type, Category, and Status.';
    return;
  }

  const payload = {
    service_tag,
    serial_number,
    host_name: document.getElementById('host_name').value.trim(),
    hardware_type_id,
    model_name: document.getElementById('model_name').value.trim(),
    category_id,
    status_id,
    teamviewer_id: document.getElementById('teamviewer_id').value.trim(),
    date_received: document.getElementById('date_received').value,
    start_date: document.getElementById('start_date').value,
    asset_owner: document.getElementById('asset_owner').value.trim(),
    box_no: document.getElementById('box_no').value.trim(),
    login_id: document.getElementById('login_id').value.trim(),
    email: document.getElementById('email').value.trim(),
    location: document.getElementById('location').value.trim(),
    remark: document.getElementById('remark').value.trim()
  };

  const res = await fetch(`/api/assets/${assetId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok) {
    msg.className = 'msg-success';
    msg.textContent = 'Asset updated successfully! Redirecting...';
    setTimeout(() => { window.location.href = '/assets.html'; }, 900);
  } else {
    msg.className = 'msg-error';
    msg.textContent = data.error || 'Error updating asset.';
  }
}

async function init() {
  await loadDropdowns();
  await loadAsset();
}
init();
</script>
</body>
</html>
